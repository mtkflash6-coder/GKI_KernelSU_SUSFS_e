- name: Configure Wireless & Driver
        run: |
          # 1. Find and update gki_defconfig wherever it is
          GKI_CONFIG=$(find . -name "gki_defconfig" | head -n 1)
          if [ -f "$GKI_CONFIG" ]; then
            echo "Found config at $GKI_CONFIG"
            echo "CONFIG_CFG80211=y" >> "$GKI_CONFIG"
            echo "CONFIG_MAC80211=y" >> "$GKI_CONFIG"
            echo "CONFIG_CFG80211_WEXT=y" >> "$GKI_CONFIG"
          else
            echo "Error: gki_defconfig not found!" && exit 1
          fi
          
          # 2. Find the wireless directory and inject driver
          WLAN_DIR=$(find . -type d -path "*/drivers/net/wireless" | head -n 1)
          if [ -d "$WLAN_DIR" ]; then
            echo "Found wireless directory at $WLAN_DIR"
            cd "$WLAN_DIR"
            mkdir -p realtek/rtl8188eus
            git clone https://github.com/aircrack-ng/rtl8188eus.git realtek/rtl8188eus
            # Use sed to add the driver to the Makefile safely
            echo "obj-y += realtek/rtl8188eus/" >> Makefile
          else
            echo "Error: Wireless directory not found!" && exit 1
          fi
