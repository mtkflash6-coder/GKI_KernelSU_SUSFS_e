name: Wild Kernel GKI 5.10 Build

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang-12 lld-12 llvm-12
          # Create symlinks to ensure 'clang' refers to version 12 as per your ADB check
          sudo ln -sf /usr/bin/clang-12 /usr/bin/clang
          sudo ln -sf /usr/bin/ld.lld-12 /usr/bin/ld.lld

      - name: Configure Wireless & Driver
        run: |
          # 1. Enable CFG80211 in the config you edited
          echo "CONFIG_CFG80211=y" >> common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_MAC80211=y" >> common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_CFG80211_WEXT=y" >> common/arch/arm64/configs/gki_defconfig
          
          # 2. Inject RTL8188EUS Driver
          cd common/drivers/net/wireless
          mkdir -p realtek/rtl8188eus
          git clone https://github.com/aircrack-ng/rtl8188eus.git realtek/rtl8188eus
          echo "obj-y += realtek/rtl8188eus/" >> Makefile

      - name: Build Kernel
        run: |
          # Disable ABI tracking to prevent failures due to the new driver
          export KMI_SYMBOL_CHECK=0
          export SKIP_ABI_WHITELIST=1
          
          # Use the build script from the WildKernels repo
          chmod +x build_abi.sh
          ./build_abi.sh

      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v4
        with:
          name: Wild-Infinix-X6532C-Kernel
          path: out/main/dist/*.zip
